<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Inter, system-ui, sans-serif;
        }

        body {
            background: #09090b;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }

        .title-block {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
        }

        .subtitle {
            font-size: 14px;
            color: #a1a1aa;
        }

        .reload-btn {
            background: transparent;
            border: 1px solid #27272a;
            color: #fafafa;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reload-btn:hover {
            background: #27272a;
        }

        .reload-icon {
            display: inline-block;
            transform: rotate(25deg);
            font-size: 16px;
        }

        .card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 16px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 14px 16px;
            font-size: 12px;
            color: #a1a1aa;
            border-bottom: 1px solid #27272a;
        }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #27272a;
        }

        tr:hover {
            background: #1f1f23;
        }

        .rank {
            font-weight: 700;
            color: #60a5fa;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .center {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .show-all {
            background: #fafafa;
            color: #09090b;
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
        }

        .show-all:hover {
            opacity: 0.9;
        }

        .medal {
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="title-block">
            <div class="title">Arm Wrestle Leaderboard</div>
            <div class="subtitle">Live rankings</div>
        </div>

        <button class="reload-btn" onclick="reloadTopTen()">
            <span class="reload-icon">↻</span>
        </button>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>User</th>
                    <th>Average Force</th>
                    <th>Max Force</th>
                    <th>Score</th>
                </tr>
            </thead>
            <tbody id="leaderboard"></tbody>
        </table>
    </div>

    <div class="center">
        <button class="show-all" onclick="loadAll()">Show All</button>
    </div>

</div>

<script>
function getMedal(index) {
    switch(index) {
        case 0: return "🥇";
        case 1: return "🥈";
        case 2: return "🥉";
        default: return "🏅";
    }
}

async function fetchData(endpoint) {
    const res = await fetch(endpoint);
    const data = await res.json();

    const tbody = document.getElementById("leaderboard");
    tbody.innerHTML = "";

    data.forEach((player, index) => {
        const row = document.createElement("tr");

        const medal = getMedal(index);

        row.innerHTML = `
            <td class="rank"><span class="medal">${medal}</span> ${index + 1}</td>
            <td>${player.user}</td>
            <td>${player.avg}</td>
            <td>${player.max}</td>
            <td>${player.score}</td>
        `;

        tbody.appendChild(row);
    });
}

function reloadTopTen() {
    fetchData('/topten');
}

function loadAll() {
    fetchData('/all');
}

fetchData('/topten');
</script>

</body>
</html>
